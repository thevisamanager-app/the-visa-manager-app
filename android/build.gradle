subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileSdkVersion = 35
                defaultConfig {
                    targetSdkVersion = 35
                    minSdkVersion = 24
                }
            }
        }
    }
}
